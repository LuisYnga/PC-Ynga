<div class="container mt-4">
  <h2 class="mb-3">Reporte de estudiantes</h2>

  @if (cargando) {
    <p>Cargando...</p>
  }

  @if (error) {
    <p class="text-danger">{{ error }}</p>
  }

  @if (!cargando && !error) {
    <table class="table table-striped table-bordered">
      <thead class="table-dark">
        <tr>
          <th>Nombre</th>
          <th>Nota 1</th>
          <th>Nota 2</th>
          <th>Nota 3</th>
          <th>Detalle</th>
        </tr>
      </thead>
      <tbody>
        @for (e of estudiantes; track e.id) {
          <tr>
            <td>{{ e.nombre }}</td>
            <td>{{ e.nota1 }}</td>
            <td>{{ e.nota2 }}</td>
            <td>{{ e.nota3 }}</td>
            <td>
              <a [routerLink]="['/detalle', e.id]" class="btn btn-primary btn-sm">Detalle</a>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
